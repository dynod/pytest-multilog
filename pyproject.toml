# Please don't edit: generated by nmk-python plugin

[build-system]
requires = [
    "setuptools",
    "setuptools_scm",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-multilog"
dynamic = ["version"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pytest",
    "pytest-xdist",
    "pathvalidate",
]
description = "Multi-process logs handling and other helpers for pytest"

[[project.authors]]
name = "The dynod project"

[[project.maintainers]]
name = "The dynod project"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
text = "MIT License"

[project.urls]
Homepage = "https://github.com/dynod/pytest-multilog"
Repository = "https://github.com/dynod/pytest-multilog"
Issues = "https://github.com/dynod/pytest-multilog/issues?q=is%3Aopen+is%3Aissue"

[dependency-groups]
dev = [
    "nmk-badges",
    "nmk-base",
    "nmk-github",
    "nmk-python",
    "nmk-vscode",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.distutils.bdist_wheel]
plat-name = "any"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {git = {commit = true,tags = true}},
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = [
    "E203",
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
junit_family = "xunit2"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = [
    "--capture=sys",
    "--junit-xml=out/tests/report.xml",
    "--cov=src",
    "--cov-report=html:out/coverage-report",
    "--cov-report=xml:out/coverage.xml",
    "--cov-report=term",
    "--cov-config=pyproject.toml",
]

[tool.coverage.run]
data_file = "out/.coverage"
concurrency = ["thread"]
disable_warnings = ["no-data-collected"]
branch = true
omit = ["src/tests/*"]
